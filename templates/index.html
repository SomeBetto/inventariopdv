<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Inventario PDV - Móvil</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Barcode Scanner Library -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>

<body>

    <header>
        <div class="logo-vibe">Abarrote Quintero</div>
        <p style="color: var(--text-dim); font-size: 0.9rem;">Control total en la palma de tu mano</p>
    </header>

    <div class="sticky-controls">
        <div id="searchControls" class="search-pill">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                stroke-linecap="round" stroke-linejoin="round" style="color: var(--text-dim)">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input type="text" id="masterSearch" placeholder="Buscar por nombre o ID..." onkeyup="multiFilter(event)">
            <button class="btn-scan" id="startScanner">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 7V5a2 2 0 0 1 2-2h2"></path>
                    <path d="M17 3h2a2 2 0 0 1 2 2v2"></path>
                    <path d="M21 17v2a2 2 0 0 1-2 2h-2"></path>
                    <path d="M3 17v2a2 2 0 0 0 2 2h2"></path>
                    <line x1="8" y1="12" x2="16" y2="12"></line>
                </svg>
            </button>
        </div>
        <div id="filterControls" class="filter-grid">
            <div class="filter-item">
                <select id="filterDept" onchange="multiFilter()">
                    <option value="">Todo el Local</option>
                </select>
            </div>
            <div class="filter-item">
                <select id="filterStock" onchange="multiFilter()">
                    <option value="all">Stock: Todos</option>
                    <option value="zero">Sin Stock</option>
                    <option value="low">Stock Bajo</option>
                </select>
            </div>
        </div>
        
        <div id="salesFilters" class="filter-grid" style="display: none;">
            <div class="filter-item">
                <select id="filterTime" onchange="loadData()">
                    <option value="day">Hoy</option>
                    <option value="week">Esta Semana</option>
                    <option value="month">Este Mes</option>
                    <option value="year">Este Año</option>
                </select>
            </div>
            <div class="filter-item">
                <select id="filterGroup" onchange="loadData()">
                    <option value="product">Por Producto</option>
                    <option value="department">Por Departamento</option>
                </select>
            </div>
            <div class="filter-item" style="grid-column: span 2;">
                <select id="filterDeptSales" onchange="loadData()">
                    <option value="">Todos los Deptos</option>
                </select>
            </div>
        </div>
    </div>

    <!-- Scanner Overlay -->
    <div id="scannerOverlay" class="scanner-overlay">
        <div class="scanner-header">
            <span>Escaneando Código...</span>
            <button onclick="stopScanning()"
                style="background: var(--error); border:none; padding: 0.5rem 1rem; border-radius: 8px; color: white; font-weight: 700;">Cerrar</button>
        </div>
        <div id="reader"></div>
    </div>

    <div id="productsBody" class="products-grid"></div>

    <!-- Bottom Sheet Modal Stock -->
    <div id="editModal" class="modal-overlay" onclick="if(event.target===this) closeModal()">
        <div class="modal">
            <div class="modal-pull"></div>
            <div class="modal-title" id="modalProdName">Ajustar Stock</div>
            <div style="text-align: center; margin-bottom: 2rem;">
                <span id="modalProdId" style="font-family: monospace; color: var(--text-dim);">ID</span>
            </div>
            <div class="qty-controls">
                <button class="btn-qty" onclick="changeQty(-1)">-</button>
                <input type="number" id="editStock" step="0.01" class="input-vibe">
                <button class="btn-qty" onclick="changeQty(1)">+</button>
            </div>
            <div style="display: flex; gap: 1rem;">
                <button class="btn-action" onclick="closeModal()"
                    style="background: rgba(255,255,255,0.05); color: white; flex: 1;">Cerrar</button>
                <button class="btn-action btn-save" onclick="saveInventory()" style="flex: 2;">Guardar Cambios</button>
            </div>
        </div>
    </div>

    <!-- Bottom Sheet Modal Prices -->
    <div id="priceModal" class="modal-overlay" onclick="if(event.target===this) closePriceModal()">
        <div class="modal">
            <div class="modal-pull"></div>
            <div class="modal-title" id="priceModalProdName">Ajustar Precios</div>

            <div style="margin-bottom: 1rem;">
                <label style="color: var(--text-dim); font-size: 0.8rem; text-transform: uppercase;">Precio de
                    Compra</label>
                <input type="number" id="editCosto" step="0.01" class="input-vibe"
                    style="margin-top: 0.5rem; text-align: left; font-size: 1.5rem;" onkeyup="calcProfitPreview()">
            </div>

            <div style="margin-bottom: 1.5rem;">
                <label style="color: var(--text-dim); font-size: 0.8rem; text-transform: uppercase;">Precio de
                    Venta</label>
                <input type="number" id="editVenta" step="0.01" class="input-vibe"
                    style="margin-top: 0.5rem; text-align: left; font-size: 1.5rem;" onkeyup="calcProfitPreview()">
            </div>

            <div style="text-align: center; margin-bottom: 2rem;">
                <span style="color: var(--text-dim); font-size: 0.9rem;">Ganancia Proyectada: </span>
                <span id="profitPreview" style="color: #a78bfa; font-weight: 700; font-size: 1.2rem;">0%</span>
            </div>

            <div style="display: flex; gap: 1rem;">
                <button class="btn-action" onclick="closePriceModal()"
                    style="background: rgba(255,255,255,0.05); color: white; flex: 1;">Cerrar</button>
                <button class="btn-action btn-save" onclick="savePrices()" style="flex: 2;">Actualizar Precios</button>
            </div>
        </div>
    </div>

    <!-- Bottom Sheet Modal Catalog -->
    <div id="descModal" class="modal-overlay" onclick="if(event.target===this) closeDescModal()">
        <div class="modal">
            <div class="modal-pull"></div>
            <div class="modal-title" id="descModalProdName">Ajustar Descripción</div>
            <div style="text-align: center; margin-bottom: 1rem;">
                <span id="descModalProdId" style="font-family: monospace; color: var(--text-dim);">ID</span>
            </div>

            <div style="margin-bottom: 2rem;">
                <input type="text" id="editDesc" class="input-vibe" style="font-size: 1.2rem; text-align: left;">
            </div>

            <div style="display: flex; gap: 1rem;">
                <button class="btn-action" onclick="closeDescModal()"
                    style="background: rgba(255,255,255,0.05); color: white; flex: 1;">Cerrar</button>
                <button class="btn-action btn-save" onclick="saveDescription()" style="flex: 2;">Actualizar</button>
            </div>
        </div>
    </div>

    <nav class="bottom-nav">
        <div class="nav-item active" id="tab-inventory" onclick="changeTab('inventory')">
            <span class="nav-icon">📦</span>
            <span>Inventario</span>
        </div>
        <div class="nav-item" id="tab-prices" onclick="changeTab('prices')">
            <span class="nav-icon">💵</span>
            <span>Precios</span>
        </div>
        <div class="nav-item" id="tab-catalog" onclick="changeTab('catalog')">
            <span class="nav-icon">📝</span>
            <span>Catálogo</span>
        </div>
        <div class="nav-item" id="tab-sales" onclick="changeTab('sales')">
            <span class="nav-icon">📊</span>
            <span>Ventas</span>
        </div>
    </nav>

    <div id="toast"></div>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>

</html>
